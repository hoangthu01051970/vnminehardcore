    # [VI] Rank tối đa có thể nâng sau này; hợp lệ từ 1 đến 5.
    # [EN] Maximum rank available for future upgrades; valid range is 1 to 5.
    max-rank: 5
    # [VI] Material biểu tượng skill; phải là item Material hợp lệ.
    # [EN] Skill icon Material; must be a valid item Material.
    icon: AMETHYST_SHARD
    # [VI] ID sách duy nhất mở khóa skill này; phải trùng book ID trong skill-books.yml.
    # [EN] Unique book ID that unlocks this skill; must match a book ID in skill-books.yml.
    book-id: mana-flow-manual
    # [VI] Lore truyền thừa của skill; từ 1 đến 20 dòng, mỗi dòng không rỗng.
    # [EN] Skill inheritance lore; 1 to 20 non-empty lines.
    lore:
      - "Hãy để ma lực đi qua mình, đừng cố gắng cưỡng ép nó."
      - "Sự tĩnh lặng cũng là một dạng sức mạnh."

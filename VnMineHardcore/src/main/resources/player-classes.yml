# [VI] Class có thể chọn. Khóa dưới 'classes' là ID ổn định, không đổi sau phát hành.
# [EN] Selectable classes. Keys under 'classes' are stable IDs and must not change after release.
# [VI] Mỗi chủng tộc hỗ trợ tối đa 28 class trong GUI; mỗi class chỉ thuộc một race.
# [EN] Each race supports up to 28 classes in the GUI; each class belongs to one race.
classes:
  swordsman:
    # [VI] ID chủng tộc trong races.yml mà class này dành cho; bắt buộc.
    # [EN] Race ID from races.yml this class belongs to; required.
    race: human
    # [VI] Tên hiển thị; bắt buộc, không được để trống.
    # [EN] Display name; required and must not be blank.
    name: "Lính kiếm"
    # [VI] Vật phẩm Minecraft dùng làm biểu tượng; phải là Material hợp lệ.
    # [EN] Minecraft item used as the icon; must be a valid Material.
    icon: IRON_SWORD
    # [VI] Mô tả ngắn hiển thị trong GUI; bắt buộc, không được để trống.
    # [EN] Short description shown in the GUI; required and must not be blank.
    description: "Chống chịu tốt, cận chiến bền bỉ."
  guardian:
    # [VI] Race mặc định; phải tham chiếu tới ID có trong races.yml.
    # [EN] Default race; must reference an ID defined in races.yml.
    race: human
    # [VI] Tên hiển thị mặc định; chuỗi không rỗng.
    # [EN] Default display name; must be a non-empty string.
    name: "Vệ binh"
    # [VI] Biểu tượng mặc định; phải là Material có thể cầm/nằm trong inventory.
    # [EN] Default icon; must be an item Material usable in an inventory.
    icon: SHIELD
    # [VI] Mô tả mặc định; chuỗi không rỗng.
    # [EN] Default description; must be a non-empty string.
    description: "Phòng thủ mạnh, giữ đội hình."
